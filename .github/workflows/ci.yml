name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: mobile/go.sum
      - name: Test root module with race detector
        run: go test -race -count=1 ./...
      - name: Vet root module
        run: go vet ./...
      - name: Test mobile module with race detector
        run: go test -race -count=1 ./...
        working-directory: mobile
      - name: Vet mobile module
        run: go vet ./...
        working-directory: mobile
      - name: Check Go formatting
        run: test -z "$(gofmt -l calendar mobile pagination ustc young)"

  apple:
    name: Apple binding
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: mobile/go.sum
      - name: Build device, simulator and host framework
        run: time scripts/build-apple.sh
      - name: Verify Swift binding against shared fixtures
        working-directory: apple
        run: swift test
      - name: Verify iOS binding on the simulator
        working-directory: apple
        run: |
          xcodebuild test -scheme LifeClientCore \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath ../.build/apple-tests.xcresult -quiet
      - name: Verify released Swift package
        run: swift build
      - name: Package framework
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent apple/Frameworks/LifeCore.xcframework dist/LifeCore.xcframework.zip
          swift package compute-checksum dist/LifeCore.xcframework.zip > dist/LifeCore.xcframework.sha256
          git rev-parse HEAD > dist/source-commit.txt
          du -sh apple/Frameworks/LifeCore.xcframework dist/LifeCore.xcframework.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LifeCore-xcframework
          path: dist/
          if-no-files-found: error
